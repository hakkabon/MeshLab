name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      - name: Check architecture and dependency boundaries
        run: ./Scripts/check-architecture.sh

      - name: Cache SwiftPM dependencies and build products
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: meshlab-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            meshlab-${{ runner.os }}-

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Deterministic validation corpus
        run: swift run MeshLabValidate --baseline Validation/baselines/standard.json

      - name: Build (release)
        run: swift build -c release

      - name: Benchmark smoke test
        run: swift run -c release MeshLabBenchmarks --quick
